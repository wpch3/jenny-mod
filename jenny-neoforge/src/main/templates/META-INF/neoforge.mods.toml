modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/wpch3/jenny-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Trolmastercard (original 1.12.2), community NeoForge port"
description = '''
Jenny Mod - GeckoLib companion NPCs for Minecraft 1.21.1 (NeoForge).
Clean-room port of the official 1.12.2 Forge release (v1.1.0 content parity).
Requires GeckoLib 4.x.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.9,)"
ordering = "AFTER"
side = "BOTH"
