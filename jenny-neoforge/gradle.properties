# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment (human-readable Mojang parameter names + javadoc).
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

# Mod Properties
mod_id=sexmod
mod_name=Jenny Mod
mod_license=All Rights Reserved
mod_version=1.1.0
mod_group_id=com.trolmastercard.sexmod

# Pinned dependency versions (verified against the 1.21.1 fan-port jar manifest/installer).
geckolib_version=4.9.2

# HTTP(S) proxy template (Gradle/Java do NOT pick up the OS system proxy automatically).
# If this machine needs a proxy (Clash / V2Ray / HeySocks / ...), uncomment and set your port:
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
