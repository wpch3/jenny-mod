# Environment Properties
# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
loader_version_range=[1,)

# Mod Properties
mod_id=sexmod
mod_name=Jenny Mod
mod_license=All Rights Reserved
mod_version=1.1.0
mod_group_id=com.trolmastercard.sexmod

# Pinned dependency versions (verified against the 1.21.1 fan-port jar manifest/installer).
geckolib_version=4.9.2
